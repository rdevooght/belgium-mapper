<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Carto facile</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="stylesheet" type="text/css" href="bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="leaflet/leaflet.css" />
</head>
<body>
  <div class="container">
    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" />
    <div id="loader" style="display: none;">Loading file...</div>
    
  </div>
  <!-- Libraries and custom utility code -->
  <script src="bootstrap/js/bootstrap.min.js"></script>
  <script src="leaflet/leaflet.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="geodata/possible_geo_identifiers.js"></script>
  <script src="js/data_parser.js"></script>

  <script>
    document.getElementById('excelFile').addEventListener('change', function(e) {
      var file = e.target.files[0];
      var reader = new FileReader();
      reader.onloadstart = function() {
        document.getElementById('loader').style.display = 'block';
      };
      reader.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, {type: 'array'});
        // Now you can access the workbook object and read its sheets.
        // For example, to read the first sheet as JSON:
        var firstSheet = workbook.SheetNames[0];
        var jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        console.log(jsonData);
        document.getElementById('loader').style.display = 'none';
      };
      reader.readAsArrayBuffer(file);
    });

    
  </script>
</body>
</html>
